# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "63238367b9259cedd09c67c4cc3a2544"
# Appsy's production address (the container on the EC2 server, behind nginx). It must match
# SHOPIFY_APP_URL on the server (https://shopify.dev/docs/apps/launch/deployment/deploy-to-hosting-service).
application_url = "https://appsy.scopegen.in"
embedded = true
name = "Appsy"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_products: the editor's product and collection pickers, and the names it shows for them.
# read_product_listings + read_publications: sales channel connection and Appsy's publication (spike S1).
# unauthenticated_*: delegated to Appsy's Storefront token, which merchant apps use (docs/05, section 1).
# read_files: pictures merchants choose in the editor come from the store's own Shopify Files
# (Appsy reads a file's address and status; it never uploads, so no write_files).
# read_online_store_navigation: the editor lists the store's menus for the app's side menu; phones
# then read the chosen menu with the Storefront token (unauthenticated_read_content).
# Shopper login (decided 2026-10-08, docs/spikes/S3): Appsy's own client by default plus an optional
# merchant Headless client. customer_* scopes and [customer_authentication] are added in Phase 3,
# with Appsy's real HTTPS callback, when the login feature is built.
# read_only_own_orders (analytics' orders and sales; it reads only the orders the channel created)
# isn't listed here: App Store requirement 5.7.1 says Shopify adds it during review, and the CLI
# refuses it in this file ("These scopes are invalid", tried on the development store 2026-10-16).
# write_resource_feedbacks: the "publish your design" step on the merchant's admin home
# (shopResourceFeedbackCreate, App Store requirement 5.7.3; added 2026-10-27).
scopes = "read_products,read_product_listings,read_publications,read_files,read_online_store_navigation,unauthenticated_read_product_listings,unauthenticated_read_product_inventory,unauthenticated_read_product_tags,unauthenticated_read_metaobjects,unauthenticated_read_content,unauthenticated_read_checkouts,unauthenticated_write_checkouts,unauthenticated_read_selling_plans,write_resource_feedbacks"
# Optional: stores grant these later, only if they use the feature, and can decline them
# (https://shopify.dev/docs/apps/build/authentication-authorization/app-installation/manage-access-scopes).
# read_discounts: the list of app-only discount codes on the Functionality page (added 2026-10-28).
optional_scopes = [ "read_discounts" ]

[webhooks]
# A stable version, the same as the rest of the app (app/shopify.server.ts); 2027-01 is a
# release candidate (https://shopify.dev/docs/api/usage/versioning).
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory for every App Store app (https://shopify.dev/docs/apps/build/compliance/privacy-law-compliance).
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://appsy.scopegen.in/auth/callback" ]

[build]
automatically_update_urls_on_dev = true

# Size charts (Functionality page): Appsy-owned entries in the store's Shopify, which apps read
# and write without access scopes (shopify.dev changelog, 2026-04). Merchants see and can edit
# them in Shopify admin, and phones read them with Appsy's Storefront token
# (https://shopify.dev/docs/apps/build/metaobjects/manage-metaobject-definitions).
[metaobjects.app.size_chart]
name = "Size chart"
description = "A size chart for your Appsy mobile app. Make and edit charts in Appsy."
display_name_field = "name"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[metaobjects.app.size_chart.fields.name]
name = "Name"
type = "single_line_text_field"
required = true

[metaobjects.app.size_chart.fields.table]
name = "Table"
description = "Column headings and rows of sizes, made in Appsy."
type = "json"

[metaobjects.app.size_chart.fields.image]
name = "Picture"
type = "file_reference"
validations.file_type_options = ["Image"]

[metaobjects.app.size_chart.fields.note]
name = "How to measure"
type = "multi_line_text_field"

[metaobjects.app.size_chart.fields.page]
name = "Size guide page"
description = "A page of your online store, shown in the app's browser."
type = "page_reference"

# No size chart field on products: Shopify requires write_products to declare one ("[product]:
# Requires the following access scope: write_products", shopify app dev, 2026-10-30), and Appsy
# only reads products. A product gets its own chart through a product rule in Appsy instead.
